<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 游戏测试</title>
    <style>
        body {
            font-family: 'Consolas', 'Monaco', monospace;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #4ecca3;
            border-bottom: 2px solid #4ecca3;
            padding-bottom: 10px;
        }
        .test-result {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
        }
        .pass {
            background: #1b4332;
            border-left: 4px solid #4ecca3;
        }
        .fail {
            background: #4a1f1f;
            border-left: 4px solid #e63946;
        }
        .summary {
            margin-top: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        .summary h3 {
            color: #4ecca3;
            margin-bottom: 10px;
        }
        .stats {
            display: flex;
            gap: 20px;
        }
        .stat {
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: bold;
        }
        .pass-rate {
            font-size: 32px;
            color: #4ecca3;
        }
        .error-detail {
            margin-top: 20px;
            padding: 15px;
            background: #2d1f1f;
            border-radius: 8px;
        }
        .error-detail h4 {
            color: #e63946;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>🎮 2048 游戏测试报告</h1>
    <div id="test-output"></div>
    
    <script src="../src/js/grid.js"></script>
    <script src="../src/js/tile.js"></script>
    <script src="../src/js/score.js"></script>
    <script src="test.js"></script>
    <script>
        // 重写 console.log 以在页面显示
        const output = document.getElementById('test-output');
        const logs = [];
        
        const originalLog = console.log;
        console.log = function(...args) {
            const message = args.join(' ');
            logs.push(message);
            originalLog.apply(console, args);
        };
        
        // 运行测试
        window.onload = function() {
            const results = runAllTests();
            
            // 渲染结果
            let html = '';
            
            logs.forEach(log => {
                if (log.startsWith('✅')) {
                    html += `<div class="test-result pass">${log}</div>`;
                } else if (log.startsWith('❌')) {
                    html += `<div class="test-result fail">${log}</div>`;
                } else if (log.startsWith('===')) {
                    html += `<h2>${log}</h2>`;
                }
            });
            
            // 添加汇总
            const passRate = ((results.passed / results.total) * 100).toFixed(1);
            html += `
                <div class="summary">
                    <h3>📊 测试结果汇总</h3>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-value">${results.total}</div>
                            <div>总计</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" style="color: #4ecca3">${results.passed}</div>
                            <div>通过</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value" style="color: #e63946">${results.failed}</div>
                            <div>失败</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value pass-rate">${passRate}%</div>
                            <div>通过率</div>
                        </div>
                    </div>
                </div>
            `;
            
            // 显示失败详情
            if (results.details.length > 0) {
                html += `<div class="error-detail"><h4>❌ 失败详情</h4>`;
                results.details.forEach((detail, i) => {
                    html += `<p><strong>${i + 1}. ${detail.name}</strong>: ${detail.message}</p>`;
                });
                html += `</div>`;
            }
            
            output.innerHTML = html;
        };
    </script>
</body>
</html>
